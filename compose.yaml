---
name: vid

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Both schema upgrades and runtime grants must succeed before apps can start.
  migrate:
    build:
      context: .
      dockerfile: deploy/docker/application.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?}\
        @postgres:5432/${POSTGRES_DB:-vid}?sslmode=disable"
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-vid}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
      PGCONNECT_TIMEOUT: '10'
      SERVER_DB_PASSWORD: ${SERVER_DB_PASSWORD:?Missing SERVER_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Missing WORKER_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    environment:
      SERVER_REDIS_PASSWORD: ${SERVER_REDIS_PASSWORD:?}
      WORKER_REDIS_PASSWORD: ${WORKER_REDIS_PASSWORD:?}
    # Redis does not interpolate env in ACL files. Hash via stdin and write the
    # two native users locally; no template, provisioner or external bootstrap.
    entrypoint: [sh, -ec]
    command:
      - |
        umask 077
        server_hash=$$(printf '%s' "$$SERVER_REDIS_PASSWORD" |
          sha256sum | cut -d ' ' -f 1)
        worker_hash=$$(printf '%s' "$$WORKER_REDIS_PASSWORD" |
          sha256sum | cut -d ' ' -f 1)
        printf '%s\n' \
          'user default off' \
          "user vid_server on #$$server_hash -@all \
          +ping +quit +client|setinfo +client|setname \
          (+xadd ~vid:execution:commands) \
          (+xgroup|create +xreadgroup +xautoclaim +xack \
          ~vid:execution:events)" \
          "user vid_worker on #$$worker_hash -@all \
          +ping +quit +client|setinfo +client|setname \
          (+xadd ~vid:execution:events) \
          (+xgroup|create +xreadgroup +xautoclaim +xack \
          ~vid:execution:commands)" \
          > /run/vid-redis/users.acl
        chown redis:redis /run/vid-redis /run/vid-redis/users.acl
        unset SERVER_REDIS_PASSWORD WORKER_REDIS_PASSWORD
        unset server_hash worker_hash
        exec /usr/local/bin/docker-entrypoint.sh redis-server \
          --appendonly yes --appendfsync everysec \
          --aclfile /run/vid-redis/users.acl
    tmpfs:
      - /run/vid-redis:mode=0700
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$SERVER_REDIS_PASSWORD"
          redis-cli --user vid_server ping | grep -q PONG
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  objects:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_ROOT_PASSWORD:?}
    volumes:
      - objects-data:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/ready]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Only this native, short-lived job receives storage administration secrets.
  storage-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    environment:
      OBJECT_STORAGE_URL: ${OBJECT_STORAGE_URL:-http://objects:9000}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-vid-assets}
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_ROOT_PASSWORD:?}
      SERVER_ACCESS_KEY: ${SERVER_OBJECT_STORAGE_ACCESS_KEY_ID:?}
      SERVER_SECRET_KEY: ${SERVER_OBJECT_STORAGE_SECRET_ACCESS_KEY:?}
      WORKER_ACCESS_KEY: ${WORKER_OBJECT_STORAGE_ACCESS_KEY_ID:?}
      WORKER_SECRET_KEY: ${WORKER_OBJECT_STORAGE_SECRET_ACCESS_KEY:?}
    volumes:
      - ./deploy/storage:/policies:ro
    tmpfs:
      - /run/storage:mode=0700
    entrypoint: [bash, -ec]
    command:
      - |
        # External S3 is operator-provisioned, never managed with local root.
        [ "$$OBJECT_STORAGE_URL" = http://objects:9000 ] || exit 0
        set -o pipefail
        stage=input
        trap \
          'echo "Local object storage initialization failed: $$stage" >&2' ERR
        umask 077
        export MC_CONFIG_DIR=/run/storage/client
        bucket=$$OBJECT_STORAGE_BUCKET
        [[ "$$bucket" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$$ ]]
        [[ "$$bucket" != *..* && "$$bucket" != *.-* && "$$bucket" != *-.* ]]
        [[ ! "$$bucket" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$$ ]]
        [ "$$SERVER_ACCESS_KEY" != "$$WORKER_ACCESS_KEY" ]
        [ "$$SERVER_ACCESS_KEY" != "$$MINIO_ROOT_USER" ]
        [ "$$WORKER_ACCESS_KEY" != "$$MINIO_ROOT_USER" ]
        stage=alias
        printf '%s\n%s\n' "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" |
          mcli alias set local http://objects:9000 --api S3v4 --path on \
          >/dev/null 2>&1
        unset MINIO_ROOT_USER MINIO_ROOT_PASSWORD
        stage=bucket
        mcli mb --ignore-existing "local/$$bucket" >/dev/null 2>&1
        # Canonical full-JSON template contract: this reserved ARN prefix occurs
        # only at Resource bucket slots. Real-JSON conformance is gated by
        # tests/scripts/storage-initialization.test.ts; not a generic renderer.
        slot='arn:aws:s3:::vid-assets/'
        for role in server worker; do
          stage=$$role-policy
          policy=$$(cat "/policies/$$role-policy.json" 2>/dev/null)
          printf '%s\n' "$${policy//"$$slot"/"arn:aws:s3:::$$bucket/"}" \
            > "/run/storage/$$role.json"
          mcli admin policy create local "$$role" \
            "/run/storage/$$role.json" >/dev/null 2>&1
        done
        stage=server-principal
        printf '%s\n%s\n' "$$SERVER_ACCESS_KEY" "$$SERVER_SECRET_KEY" |
          mcli admin user add local >/dev/null 2>&1
        stage=worker-principal
        printf '%s\n%s\n' "$$WORKER_ACCESS_KEY" "$$WORKER_SECRET_KEY" |
          mcli admin user add local >/dev/null 2>&1
        stage=server-attach
        mcli admin policy attach local server --user "$$SERVER_ACCESS_KEY" \
          >/dev/null 2>&1
        stage=worker-attach
        mcli admin policy attach local worker --user "$$WORKER_ACCESS_KEY" \
          >/dev/null 2>&1
    depends_on:
      objects:
        condition: service_healthy
    restart: 'no'

  server:
    # A finite grace period is not proof that remote effects stopped.
    stop_grace_period: 1m
    build:
      context: .
      dockerfile: deploy/docker/application.Dockerfile
      target: server
    environment:
      DATABASE_URL: "postgres://vid_server:${SERVER_DB_PASSWORD:?}\
        @postgres:5432/${POSTGRES_DB:-vid}?sslmode=disable"
      REDIS_URL: redis://vid_server:${SERVER_REDIS_PASSWORD:?}@redis:6379
      PORT: ${PORT:-8787}
      OBJECT_STORAGE_URL: ${OBJECT_STORAGE_URL:-http://objects:9000}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-vid-assets}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${SERVER_OBJECT_STORAGE_ACCESS_KEY_ID:?}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${SERVER_OBJECT_STORAGE_SECRET_ACCESS_KEY:?}
      ASSET_MAX_BYTES: ${ASSET_MAX_BYTES:-}
      ASSET_MAX_FILES: ${ASSET_MAX_FILES:-}
      FILE_IO_TIMEOUT_MS: ${FILE_IO_TIMEOUT_MS:-}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      IO_TIMEOUT_MS: ${IO_TIMEOUT_MS:-}
      POLL_MS: ${POLL_MS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch("http://127.0.0.1:"+(Bun.env.PORT || "8787")+"/api/session")
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 5s
      retries: 30
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/docker/application.Dockerfile
      target: web
    environment:
      SERVER_PORT: ${PORT:-8787}
    ports:
      - '127.0.0.1:${PUBLIC_PORT:-8787}:8080'
    depends_on:
      server:
        condition: service_healthy
    init: true
    restart: unless-stopped

  worker:
    stop_grace_period: 2m
    build:
      context: .
      dockerfile: deploy/docker/application.Dockerfile
      target: worker
    environment:
      DATABASE_URL: "postgres://vid_worker:${WORKER_DB_PASSWORD:?}\
        @postgres:5432/${POSTGRES_DB:-vid}?sslmode=disable"
      REDIS_URL: redis://vid_worker:${WORKER_REDIS_PASSWORD:?}@redis:6379
      OBJECT_STORAGE_URL: ${OBJECT_STORAGE_URL:-http://objects:9000}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-vid-assets}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${WORKER_OBJECT_STORAGE_ACCESS_KEY_ID:?}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${WORKER_OBJECT_STORAGE_SECRET_ACCESS_KEY:?}
      ASSET_MAX_BYTES: ${ASSET_MAX_BYTES:-}
      ASSET_MAX_FILES: ${ASSET_MAX_FILES:-}
      FILE_IO_TIMEOUT_MS: ${FILE_IO_TIMEOUT_MS:-}
      WEB_SEARCH_AUTH_MODE: ${WEB_SEARCH_AUTH_MODE:-keyless}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:?Missing MODEL_BASE_URL}
      MODEL_API_KEY: ${MODEL_API_KEY:?Missing MODEL_API_KEY}
      MODEL_ID: ${MODEL_ID:?Missing MODEL_ID}
      MODEL_CONTEXT_WINDOW: ${MODEL_CONTEXT_WINDOW:?}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:?}
      MODEL_REASONING: ${MODEL_REASONING:-}
      MODEL_INPUT: ${MODEL_INPUT:-}
      MODEL_PROMPT_PATH: ${MODEL_PROMPT_PATH:-}
      E2B_API_URL: ${E2B_API_URL:?Missing E2B_API_URL}
      E2B_API_KEY: ${E2B_API_KEY:?Missing E2B_API_KEY}
      E2B_SANDBOX_URL: ${E2B_SANDBOX_URL:?Missing E2B_SANDBOX_URL}
      E2B_TEMPLATE: ${E2B_TEMPLATE:-}
      SANDBOX_TIMEOUT_MS: ${SANDBOX_TIMEOUT_MS:-}
      LEASE_MS: ${LEASE_MS:-}
      POLL_MS: ${POLL_MS:-}
      CONCURRENCY: ${CONCURRENCY:-}
      IO_TIMEOUT_MS: ${IO_TIMEOUT_MS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          const r = await fetch('http://127.0.0.1:8788/readyz');
          process.exit(r.ok ? 0 : 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    init: true
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  objects-data:
