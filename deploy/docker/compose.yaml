# Everything a developer needs running to work on this, and nothing a deploy uses.
#
# The Postgres patch version is pinned rather than floated. `pg_dump` stamps its own version
# into the schema dump, so an image that moved underneath someone would make `check` fail on
# a diff nobody wrote.
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: vid
      POSTGRES_PASSWORD: vid
      POSTGRES_DB: vid
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vid']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  # Object storage, speaking S3 so the code that talks to it is the code that will talk to a
  # real bucket.
  objects:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: vid
      MINIO_ROOT_PASSWORD: vid-secret
    ports: ['9000:9000', '9001:9001']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 20

  # Makes the bucket once and exits. `docker compose run --rm objects-ready` is the whole of
  # first-time setup.
  objects-ready:
    image: quay.io/minio/mc:latest
    depends_on:
      objects:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://objects:9000 vid vid-secret &&
             mc mb --ignore-existing local/vid"
    profiles: ['setup']
